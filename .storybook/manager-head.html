<style>
  /* Storybook interface: IBM Plex everywhere */
  body, button, input { font-family: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; }

  /* ── Dark sidebar, with the colours of our palette ──
     #525252 = the Acceso fácil panel (--af-canvas) · #FFFFFF text and folders (7.8:1) · #84FF00 brand band (--brand)
     icons: #F8C4A0 pages (intros, docs) · #78A9FF component groups and stories (--blue-light)
     #666666 hover (--gray-600) · #0F62FE selected (--blue, white text 5.0:1) */
  #storybook-sidebar-region { background: #525252 !important; color: #FFFFFF; border-right: 0 !important; }
  #storybook-sidebar-region .sidebar-header,
  #storybook-sidebar-region .sidebar-header * { color: #FFFFFF !important; }
  #storybook-sidebar-region .sidebar-header button:hover { background: #666666 !important; }

  /* search */
  #storybook-sidebar-region .search-field { background: #666666 !important; border: 1px solid #FFFFFF !important; border-radius: 0 !important; box-shadow: none !important; color: #FFFFFF !important; }
  #storybook-sidebar-region .search-field * { color: #FFFFFF !important; }
  #storybook-sidebar-region #storybook-explorer-searchfield { color: #FFFFFF !important; background: transparent !important; }
  #storybook-sidebar-region #storybook-explorer-searchfield::placeholder { color: #FFFFFF !important; opacity: 1; }
  #storybook-sidebar-region .search-field:focus-within { outline: 2px solid #FFD600 !important; outline-offset: 2px; }

  /* tree: roots (APP, CHATBOT…), groups, pages */
  #storybook-explorer-tree .sidebar-subheading,
  #storybook-explorer-tree .sidebar-subheading button { color: #FFFFFF !important; }
  #storybook-explorer-tree .sidebar-item,
  #storybook-explorer-tree .sidebar-item a,
  #storybook-explorer-tree .sidebar-item button { color: #FFFFFF !important; background: transparent; border-radius: 0 !important; }
  #storybook-explorer-tree .sidebar-item svg,
  #storybook-explorer-tree .sidebar-subheading svg { color: #FFFFFF !important; }
  #storybook-explorer-tree .sidebar-item:hover,
  #storybook-explorer-tree .sidebar-item a:hover,
  #storybook-explorer-tree .sidebar-item button:hover { background: #666666 !important; }
  #storybook-explorer-tree .sidebar-item[data-selected="true"],
  #storybook-explorer-tree .sidebar-item[data-selected="true"] a,
  #storybook-explorer-tree .sidebar-item[data-selected="true"] button { background: #0F62FE !important; color: #FFFFFF !important; }
  #storybook-explorer-tree .sidebar-item button { box-shadow: none !important; }   /* the “…” menu: no light glow */
  #storybook-sidebar-region, #storybook-sidebar-region * { scrollbar-color: #666666 #525252; }
  #storybook-sidebar-region a:focus-visible, #storybook-sidebar-region button:focus-visible { outline: 2px solid #FFD600 !important; outline-offset: -2px; box-shadow: none !important; }

  /* brand band, title, root names */
  #storybook-sidebar-region { border-top: 40px solid #84FF00 !important; box-sizing: border-box; }
  #storybook-sidebar-region .sidebar-header a:not([href^="#"]) { font-family: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif !important; font-size: 24px !important; font-weight: 400 !important; line-height: 32px !important; white-space: nowrap; }
  #storybook-explorer-tree .sidebar-subheading button { font-size: 12px !important; }

  /* type icons (the direct icon of each row; the expand chevron is nested deeper and stays white) */
  #storybook-explorer-tree .sidebar-item[data-nodetype="document"] > a > div > svg { color: #F8C4A0 !important; }
  #storybook-explorer-tree .sidebar-item[data-nodetype="story"] > a > div > svg { color: #78A9FF !important; }
  #storybook-explorer-tree .sidebar-item[data-nodetype="group"] > button > div > svg { color: #FFFFFF !important; }
